[versions]
# Versions mirror Chess+ rather than the newest available, so this app builds
# against the same Compose/MMD combination that is known to work on the Kompakt.
agp = "8.13.1"
kotlin = "2.2.21"
mmd = "1.0.2"

androidx-activity = "1.12.0"
androidx-core = "1.17.0"
androidx-lifecycle = "2.10.0"
androidx-compose = "1.9.5"
androidx-material3 = "1.4.0"

junit = "4.13.2"
work = "2.11.2"
appcompat = "1.7.1"
exifinterface = "1.4.2"
legacy-support = "1.0.0"
json = "20240303"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }

compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "androidx-compose" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "androidx-material3" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "androidx-compose" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "androidx-compose" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "androidx-compose" }

mmd = { module = "com.mudita:MMD", version.ref = "mmd" }

# Open Camera's engine is built on these; kept at upstream's versions.
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
legacy-support = { module = "androidx.legacy:legacy-support-v4", version.ref = "legacy-support" }

junit = { module = "junit:junit", version.ref = "junit" }
# Android's org.json is a stub in local unit tests; this is the real one, for tests only.
json = { module = "org.json:json", version.ref = "json" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
